[project]
name = "archiviste"
version = "0.1.0"
description = "Index, recherche, doublons et propositions de rangement des archives personnelles et professionnelles"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pypdf>=4",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
archiviste = "archiviste.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["archiviste"]

[tool.pytest.ini_options]
testpaths = ["tests"]
